<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 628 435" role="img" aria-labelledby="title desc">
  <title id="title">Crime and Criminal Tracking Network and Systems</title>
  <desc id="desc">CCNS crime alert logo with a radar target and tracking signal.</desc>
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#f4f4f4"/>
      <stop offset="100%" stop-color="#dedede"/>
    </radialGradient>
    <linearGradient id="letterFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="48%" stop-color="#a71922"/>
      <stop offset="100%" stop-color="#140303"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="628" height="435" fill="url(#paper)"/>
  <g transform="translate(314 218)">
    <circle r="185" fill="none" stroke="#9f9f9f" stroke-width="4"/>
    <circle r="118" fill="none" stroke="#9f9f9f" stroke-width="4"/>
    <circle r="62" fill="none" stroke="#b8b8b8" stroke-width="3"/>
    <line x1="-205" y1="0" x2="205" y2="0" stroke="#b6b6b6" stroke-width="2"/>
    <line x1="0" y1="-205" x2="0" y2="205" stroke="#b6b6b6" stroke-width="2"/>
  </g>

  <text x="314" y="78" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="30" letter-spacing="9" fill="#0a0a0a" transform="rotate(-6 314 78)">CRIME AND CRIMINAL TRACKING</text>
  <text x="314" y="394" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="30" letter-spacing="9" fill="#0a0a0a" transform="rotate(6 314 394)">NETWORK AND SYSTEMS</text>

  <g filter="url(#softShadow)">
    <text x="82" y="276" font-family="Arial Black, Impact, sans-serif" font-size="150" fill="url(#letterFill)" stroke="#2a0505" stroke-width="2">CC</text>
    <text x="390" y="276" font-family="Arial Black, Impact, sans-serif" font-size="150" fill="url(#letterFill)" stroke="#2a0505" stroke-width="2">NS</text>
  </g>

  <g transform="translate(314 214)" filter="url(#softShadow)">
    <path d="M0 -70 C20 -70 34 -55 34 -38 L20 70 H-20 L-34 -38 C-34 -55 -20 -70 0 -70Z" fill="#060606"/>
    <ellipse cx="-10" cy="-42" rx="7" ry="5" fill="#ffffff"/>
    <ellipse cx="12" cy="-42" rx="7" ry="5" fill="#ffffff"/>
    <path d="M-22 -18 H22 M-19 -3 H19 M-16 12 H16 M-13 27 H13" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M-55 -58 C-82 -32 -82 8 -55 34" fill="none" stroke="#050505" stroke-width="12" stroke-linecap="square"/>
    <path d="M-78 -72 C-120 -32 -120 16 -78 50" fill="none" stroke="#050505" stroke-width="12" stroke-linecap="square"/>
    <path d="M55 -58 C82 -32 82 8 55 34" fill="none" stroke="#050505" stroke-width="12" stroke-linecap="square"/>
    <path d="M78 -72 C120 -32 120 16 78 50" fill="none" stroke="#050505" stroke-width="12" stroke-linecap="square"/>
  </g>
</svg>
